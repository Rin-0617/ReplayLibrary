name: Ingest shared replays

on:
  schedule:
    - cron: "*/30 * * * *"   # 30分ごと
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Ingest from Discord
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: node scripts/ingest.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- index.json library .cursor; then
            echo "No new replays."
            exit 0
          fi
          git config user.name "Rin"
          git config user.email "167505257+Rin-0617@users.noreply.github.com"
          git add index.json library .cursor
          git commit -m "Ingest shared replays"
          git push
